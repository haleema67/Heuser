<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Echo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <header>
    <h1>Lantern Echo</h1>
    <p id="status" role="status" aria-live="polite">Press Start. Watch the lanterns, then repeat the order.</p>
  </header>

  <section class="hud" aria-label="Scores">
    <div class="stat"><span class="label">Round</span><span id="round">0</span></div>
    <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
  </section>

  <section class="board" id="board" aria-label="Lanterns">
    <button class="lantern l0" data-i="0" aria-label="Amber lantern, key 1"><span class="glow"></span></button>
    <button class="lantern l1" data-i="1" aria-label="Teal lantern, key 2"><span class="glow"></span></button>
    <button class="lantern l2" data-i="2" aria-label="Rose lantern, key 3"><span class="glow"></span></button>
    <button class="lantern l3" data-i="3" aria-label="Violet lantern, key 4"><span class="glow"></span></button>
    <div id="sparks" class="sparks" aria-hidden="true"></div>
  </section>

  <section class="controls">
    <button id="startBtn" class="primary">Start</button>
    <button id="pauseBtn" disabled>Pause</button>
    <button id="muteBtn" aria-pressed="false">Sound on</button>
    <button id="resetBtn">Reset data</button>
  </section>
  <p class="hint">Tap the lanterns or press 1 2 3 4. Space pauses.</p>
</main>
<script src="script.js"></script>
</body>
</html>
